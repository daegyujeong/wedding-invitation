<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Naver Maps - Localhost Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            margin: 0;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        #map { 
            width: 100%; 
            height: 400px; 
            margin: 20px 0; 
            border: 2px solid #ddd; 
            border-radius: 8px;
            background: white;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            font-weight: bold;
        }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #debug { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🗺️ Naver Maps API Test - Localhost</h1>
    <p><strong>Testing URL:</strong> <span id="currentUrl"></span></p>
    <p><strong>Client ID:</strong> judjrcgb97</p>
    
    <div id="status" class="status info">🔄 Loading Naver Maps API...</div>
    <div id="map"></div>
    
    <h3>Debug Log:</h3>
    <div id="debug"></div>

    <!-- Naver Maps NCP API -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=judjrcgb97"></script>
    
    <script>
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');
        
        // Show current URL
        document.getElementById('currentUrl').textContent = window.location.href;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`);
            
            // Update status
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            // Add to debug log
            debugDiv.innerHTML += `<div style="margin: 2px 0; color: ${getLogColor(type)};">[${timestamp}] ${message}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        function getLogColor(type) {
            switch(type) {
                case 'error': return '#d63384';
                case 'success': return '#198754';
                case 'warning': return '#fd7e14';
                default: return '#0dcaf0';
            }
        }
        
        // Test API availability
        function testNaverAPI() {
            log('🔍 Checking window.naver object...');
            
            if (typeof window.naver === 'undefined') {
                log('❌ window.naver is undefined - API script may have failed to load', 'error');
                return false;
            }
            
            log('✅ window.naver exists');
            
            if (!window.naver.maps) {
                log('❌ window.naver.maps is undefined', 'error');
                return false;
            }
            
            log('✅ window.naver.maps exists');
            
            if (!window.naver.maps.Map) {
                log('❌ window.naver.maps.Map constructor is undefined', 'error');
                return false;
            }
            
            log('✅ window.naver.maps.Map constructor is available');
            return true;
        }
        
        // Initialize map
        function initializeMap() {
            try {
                log('🚀 Creating map instance...');
                
                const map = new naver.maps.Map('map', {
                    center: new naver.maps.LatLng(35.6288349, 129.2087028), // Korean wedding venue
                    zoom: 15,
                    mapTypeControl: true,
                    zoomControl: true,
                    logoControl: true
                });
                
                log('✅ Map created successfully');
                
                // Add marker
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(35.6288349, 129.2087028),
                    map: map,
                    title: '일월의정원 (Korean Wedding Venue)'
                });
                
                log('✅ Marker added successfully');
                
                // Add info window
                const infoWindow = new naver.maps.InfoWindow({
                    content: `
                        <div style="padding: 10px; min-width: 200px;">
                            <h4 style="margin: 0 0 8px 0; color: #333;">일월의정원</h4>
                            <p style="margin: 0; font-size: 13px; color: #666;">
                                울산광역시 울주군 두동면 은편리 891<br>
                                <small>위도: 35.6288349, 경도: 129.2087028</small>
                            </p>
                        </div>
                    `
                });
                
                // Show info window on marker click
                naver.maps.Event.addListener(marker, 'click', function() {
                    if (infoWindow.getMap()) {
                        infoWindow.close();
                    } else {
                        infoWindow.open(map, marker);
                    }
                });
                
                log('✅ Info window configured successfully');
                log('🎉 ALL TESTS PASSED! Naver Maps is working correctly!', 'success');
                
            } catch (error) {
                log(`❌ Error creating map: ${error.message}`, 'error');
                console.error('Full error details:', error);
                
                // Check for common authentication errors
                if (error.message.includes('인증') || error.message.includes('auth') || error.message.includes('Authentication')) {
                    log('🔑 This appears to be an authentication error. Check:', 'warning');
                    log('   1. Client ID is correct in Naver Cloud Console', 'warning');
                    log('   2. Current domain/URL is registered in console', 'warning');
                    log('   3. Maps API service is enabled', 'warning');
                }
            }
        }
        
        // Handle script load events
        window.addEventListener('load', function() {
            log('📄 Page loaded, waiting for Naver API...');
            
            // Give API time to load
            let attempts = 0;
            const maxAttempts = 50;
            
            const checkInterval = setInterval(() => {
                attempts++;
                
                if (testNaverAPI()) {
                    clearInterval(checkInterval);
                    initializeMap();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    log(`❌ Naver Maps API failed to load after ${maxAttempts * 100}ms`, 'error');
                    log('🔧 Troubleshooting steps:', 'info');
                    log('   1. Check browser console for network errors', 'info');
                    log('   2. Verify client ID is correct', 'info');
                    log('   3. Check domain registration in Naver Cloud Console', 'info');
                    log('   4. Ensure internet connection is stable', 'info');
                }
            }, 100);
        });
        
        // Handle API script errors
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('oapi.map.naver.com')) {
                log('❌ Failed to load Naver Maps script', 'error');
                log('🔍 Check network connection and client ID', 'warning');
            }
        });
    </script>
</body>
</html>
