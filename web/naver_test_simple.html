<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Naver Maps API Test</title>
    <style>
        #map { width: 100%; height: 400px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Naver Maps API Test</h1>
    <div id="status" class="status">Testing API...</div>
    <div id="map"></div>

    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=judjrcgb97"></script>
    <script>
        const statusDiv = document.getElementById('status');
        
        function log(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${isError ? 'error' : 'success'}`;
            console.log(message);
        }
        
        // Wait for API to load
        function waitForNaverMaps() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 50;
                
                const checkInterval = setInterval(() => {
                    attempts++;
                    
                    if (window.naver && window.naver.maps) {
                        clearInterval(checkInterval);
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        reject(new Error('Naver Maps API failed to load'));
                    }
                }, 100);
            });
        }
        
        // Initialize when page loads
        window.onload = async function() {
            try {
                log('Loading Naver Maps API...');
                await waitForNaverMaps();
                
                log('API loaded, creating map...');
                
                const map = new naver.maps.Map('map', {
                    center: new naver.maps.LatLng(35.6288349, 129.2087028), // Ulsan
                    zoom: 15
                });
                
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(35.6288349, 129.2087028),
                    map: map,
                    title: '일월의정원'
                });
                
                log('✅ Naver Maps loaded successfully!');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        };
    </script>
</body>
</html>
